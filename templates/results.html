<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations for "{{ query }}" - Netflix Recommender</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Header -->
    <header class="site-header py-3 mb-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <h1 class="netflix-brand"><i class="fas fa-film me-2"></i>Netflix Recommender</h1>
            <nav class="d-flex mt-2 mt-md-0 ms-md-auto">
                <button class="btn btn-sm btn-outline-secondary me-2" onclick="goBack()">
                    <i class="fas fa-arrow-left me-1"></i> Back to Search
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="card bg-dark border-secondary">
                        <div class="card-body">
                            <h2 class="card-title mb-4">Recommendations for "{{ query }}"</h2>
                            <p class="text-muted mb-4">Based on the content you like, we think you might enjoy these titles:</p>
                            
                            <div class="table-responsive">
                                {{ recommendations|safe }}
                            </div>
                            
                            <!-- Try another search -->
                            <div class="mt-5 text-center">
                                <h4>Not what you're looking for?</h4>
                                <form id="search-form" action="/recommendations" method="post" class="search-container mt-3">
                                    <div class="input-group mb-3">
                                        <input type="text" id="moviename" name="moviename" class="form-control" placeholder="Try another title..." aria-label="Movie Title" required>
                                        <button class="btn btn-netflix" type="submit">
                                            <i class="fas fa-search me-1"></i> Find Similar Content
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="text-center">
                <p>Netflix Recommendation System &copy; 2023</p>
                <small class="text-muted">This is not affiliated with Netflix Inc.</small>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
